note = "cdr_to_mdr/cpr_to_smm/mdr_to_cdr/smm_to_cpr are also re-exported at the Rust crate root and bound flat on finstack_quant.cashflows (see wasm_cashflows_subset)."
public = [
    "AmortizationSpec", "CashFlowBuilder", "CashFlowMeta", "CashFlowSchedule", "CouponType",
    "DefaultModelSpec", "FeeAccrualBasis", "FeeBase",
    "FeeSpec", "FixedCouponSpec", "FloatingCouponSpec", "FloatingRateFallback",
    "FloatingRateSpec", "Notional", "OvernightCompoundingMethod",
    "OvernightIndexConstraintApplication", "PrepaymentModelSpec", "PrincipalEvent",
    "PrincipalExchange",
    "RecoveryModelSpec", "RollRule", "ScheduleParams", "StepUpCouponSpec",
    "cdr_to_mdr", "cpr_to_smm", "mdr_to_cdr",
    "merge_cashflow_schedules", "smm_to_cpr",
]

[crates.cashflows.module_symbols.accrual]
python_package = "finstack_quant.cashflows.accrual"
public = ["AccrualConfig", "AccrualIndex", "AccrualMethod", "ExCouponRule", "accrued_interest_amount"]

[crates.cashflows.module_symbols.aggregation]
python_package = "finstack_quant.cashflows.aggregation"
public = ["aggregate_by_period", "aggregate_cashflows_checked", "calendar_year_ladder"]

[crates.cashflows.module_symbols.schema]
python_package = "finstack_quant.cashflows.schema"
public = ["get", "index", "resources", "validate"]

# ---------------------------------------------------------------------------
# WASM cashflows facade subset + symbol-level triplet pinning.
# Python names are identical to the canonical Rust function names; the map
# below pins python_snake_case -> js camelCase for every root export.
# ---------------------------------------------------------------------------
[wasm_cashflows_subset]
rust_module_root = "../finstack-quant-wasm/src/api/cashflows/"
js_export_file   = "../finstack-quant-wasm/exports/cashflows.js"
# The four prepayment/default rate-convention conversions are pure-f64
# delegations to Rust builder::credit_rates, re-exported at the Rust crate
# root. Python exposes them both flat on finstack_quant.cashflows (mirroring
# the crate root and this WASM facade) and on the typed builder submodule
# (mirroring builder::).
root_exports = [
    "accruedInterest",
    "buildCashflowScheduleJson",
    "cdrToMdr",
    "cprToSmm",
    "datedFlowsJson",
    "mdrToCdr",
    "smmToCpr",
    "validateCashflowScheduleJson",
]
# Python-only typed cashflows surface; WASM stays JSON-only by design.
python_only = [
    "accrual",
    "aggregation",
    "builder",
    "primitives",
    "schema",
]

[wasm_cashflows_subset.python_js_map]
accrued_interest = "accruedInterest"
