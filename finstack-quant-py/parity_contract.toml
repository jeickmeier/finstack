# Finstack Quant Python-Rust Structural Parity Contract
#
# This file is the authoritative source-of-truth for the canonical mapping
# between Rust crates/modules and Python packages/modules.
#
# Rules:
#   - Only `pub` items at the crate boundary are in scope. `pub(crate)` and
#     `pub(super)` are excluded.
#   - Each public Rust crate re-exported from finstack-quant/src/lib.rs maps to one
#     Python subpackage under `finstack_quant`.
#   - Audit scripts must read this file as the source-of-truth.
#   - No audit script may write to tracked repository files.

[meta]
version = "1.0.0"
description = "Canonical Rust→Python structural parity contract"
umbrella_crate = "finstack-quant"
umbrella_lib = "finstack-quant/src/lib.rs"

# ---------------------------------------------------------------------------
# finstack-quant-core  →  finstack_quant.core
# ---------------------------------------------------------------------------
[crates.core]
rust_crate = "finstack-quant-core"
rust_lib   = "finstack-quant/core/src/lib.rs"
python_package = "finstack_quant.core"
visibility = "pub"
status = "exists"  # Python package already present

[crates.core.modules]
canonical     = { python = "finstack_quant.core.canonical",     status = "missing", note = "Rust-only canonical-form normalization infrastructure; no host-language surface planned." }
cashflow      = { python = "finstack_quant.core.cashflow",      status = "missing", note = "Core cashflow APIs are not yet materialized as a dedicated Python submodule" }
config        = { python = "finstack_quant.core.config",        status = "exists" }
contract      = { python = "finstack_quant.core.contract",      status = "missing", note = "Rust-only API-contract helper infrastructure; no host-language surface planned." }
credit        = { python = "finstack_quant.core.credit",        status = "exists", note = "Includes scoring, pd, lgd, migration, recovery_waterfall, and liability_management submodules." }
currency      = { python = "finstack_quant.core.currency",      status = "exists" }
dates         = { python = "finstack_quant.core.dates",         status = "exists" }
decimal       = { python = "finstack_quant.core.decimal",       status = "missing", note = "Rust-only Decimal representation internals; hosts read amounts via Money / amount_decimal." }
error         = { python = "finstack_quant.core.error",         status = "missing" }
explain       = { python = "finstack_quant.core.explain",       status = "missing", note = "Explain helpers are not yet surfaced as a dedicated Python submodule" }
expr          = { python = "finstack_quant.core.expr",          status = "missing", note = "Expression APIs are not yet surfaced as a dedicated Python submodule" }
market_data   = { python = "finstack_quant.core.market_data",   status = "exists" }
math          = { python = "finstack_quant.core.math",          status = "exists" }
money         = { python = "finstack_quant.core.money",         status = "exists" }
prelude       = { python = "finstack_quant.core.prelude",       status = "missing" }
rating_scales = { python = "finstack_quant.core.rating_scales", status = "exists" }
serde_guard   = { python = "finstack_quant.core.serde_guard",   status = "missing", note = "Rust-only strict-serde guard helpers; enforcement happens inside (de)serialization, not as a host API." }
table         = { python = "finstack_quant.core.table",         status = "exists", note = "Arrow interchange surface. `ArrowTable` is a binding-level host-interop type backed by the supporting crate finstack-quant-arrow (not umbrella re-exported); exempt from strict crate mirroring like `reporting`. Intentionally NO WASM parity: arrow-rs is not built for wasm32." }
types         = { python = "finstack_quant.core.types",         status = "exists" }
validation    = { python = "finstack_quant.core.validation",    status = "missing", note = "Deliberately excluded, not a backlog gap: internal validation helpers — see [exclusions] entry for finstack_quant_core::validation." }
versions      = { python = "finstack_quant.core.versions",      status = "missing", note = "Rust-only schema/version metadata registry; hosts see versions stamped in result envelopes." }
wire          = { python = "finstack_quant.core.wire",          status = "missing", note = "Rust-only wire-format (de)serialization helpers backing the stable serde field names." }
schema = { python = "finstack_quant.core.schema", status = "exists", note = "Registry-backed index/get/validate over the crate's published JSON Schemas; no WASM twin." }

[crates.core.module_symbols.schema]
python_package = "finstack_quant.core.schema"
public = ["get", "index", "validate"]

# Symbol-level pinning for finstack_quant.core.market_data — every name in
# `finstack_quant.core.market_data.__all__` must appear here.
[crates.core.market_data]
python_package = "finstack_quant.core.market_data"
public = [
    "BaseCorrelationCurve",
    "CreditIndexData",
    "DiscountCurve",
    "ForwardCurve",
    "FxConversionPolicy",
    "FxDeltaVolSurface",
    "FxMatrix",
    "FxPairConvention",
    "FxQuoteConvention",
    "FxRateResult",
    "HazardCurve",
    "InflationCurve",
    "InflationIndex",
    "MarketContext",
    "PriceCurve",
    "ScalarTimeSeries",
    "VolCube",
    "VolSurface",
    "VolatilityIndexCurve",
    "arbitrage",
    "context",
    "curves",
    "dtsm",
    "fx",
    "fx_market_pair",
    "fx_pair_convention",
    "fx_pip_size",
    "invert_fx_rate",
    "scalars",
]

# Symbol-level contracts for every exposed core submodule. These are checked
# against both runtime attributes and each module's explicit `__all__`.
[crates.core.module_symbols.config]
python_package = "finstack_quant.core.config"
public = ["RoundingMode", "ToleranceConfig", "FinstackConfig"]
note = "Subset scope: the Rust config module also exposes ConfigExtensions, CurrencyScalePolicy, RoundingPolicy, RoundingContext, ZeroKind, NumericMode, ResultsMeta and the rounding_context_from/results_meta* helpers. These policy-stamp types stay Rust-only; hosts see them serialized inside result envelopes rather than as constructible objects."

[crates.core.module_symbols.types]
python_package = "finstack_quant.core.types"
public = ["Rate", "Bps", "Percentage", "CreditRating", "CurveId", "InstrumentId", "Attributes"]
note = "Subset scope: Rust-only extras are BarrierType, RatingFactorTable, RatingLabel, moodys_warf_factor, and the remaining id newtypes (CalendarId, DealId, Id, IndexId, IssuerId, PoolId, PriceId, UnderlyingId) — hosts pass those ids as plain strings on JSON/typed surfaces."

[crates.core.module_symbols.currency]
python_package = "finstack_quant.core.currency"
public = ["Currency"]
allow_additional = true # ISO-4217 code constants are generated from the Rust registry.

[crates.core.module_symbols.money]
python_package = "finstack_quant.core.money"
public = ["Money"]
note = "Subset scope: the Rust money module's FormatOpts family (FormatOpts + Money formatting entry points taking it), fx submodule types beyond the bound FxMatrix/FxConversionPolicy/FxRateResult/FxQuoteConvention/FxPairConvention helpers (FxProvider, FxConfig, FxQuery, SimpleFxProvider), rounding helpers, and Money::convert(&dyn FxProvider) remain Rust-only; hosts format via Money.format(...) and convert via convert_at_rate or MarketContext-level FX."

[crates.core.module_symbols.math]
python_package = "finstack_quant.core.math"
public = ["count_consecutive", "linalg", "stats", "special_functions", "summation"]
note = "Subset scope: 13 Rust-only math submodules are deliberately unbound (characteristic_function, compounding, distributions, fractional, integration, interp, piecewise, probability, random, solver, solver_multi, time_grid, volatility) — they are engine internals consumed by the domain crates, not host-facing numerics."

[crates.core.module_symbols.dates]
python_package = "finstack_quant.core.dates"
public = [
    "DayCount", "DayCountContext", "DayCountContextState", "Thirty360Convention",
    "TenorUnit", "Tenor",
    "PeriodKind", "PeriodId", "Period", "PeriodPlan", "FiscalConfig",
    "build_periods", "build_fiscal_periods",
    "BusinessDayConvention", "CalendarMetadata", "HolidayCalendar", "adjust", "available_calendars",
    "StubKind", "ScheduleErrorPolicy", "Schedule", "ScheduleBuilder",
    "SifmaSettlementClass", "sifma_settlement_date", "sifma_settlement_date_for_class",
    "estimated_sifma_settlement_date_for_class", "next_sifma_settlement",
    "third_wednesday", "third_friday", "next_imm", "is_imm_date", "is_cds_date",
    "next_cds_date", "prev_cds_date", "prev_cds_semiannual_roll",
    "next_semiannual_cds_maturity", "imm_option_expiry", "next_imm_option_expiry",
    "next_equity_option_expiry",
    "create_date", "days_since_epoch", "date_from_epoch_days",
]
note = "Subset scope: the Rust dates::fx (FX spot-lag/settlement date logic) and dates::calendar (calendar registry internals beyond adjust/available_calendars/CalendarMetadata) submodules remain Rust-only; hosts reach calendars by string id through adjust and the schedule builder."

[crates.core.module_symbols.market_data]
python_package = "finstack_quant.core.market_data"
public = [
    "curves", "fx", "context", "scalars", "dtsm", "arbitrage",
    "BaseCorrelationCurve", "CreditIndexData", "DiscountCurve", "ForwardCurve",
    "FxDeltaVolSurface", "HazardCurve", "InflationCurve", "PriceCurve", "VolSurface",
    "VolCube", "VolatilityIndexCurve", "FxConversionPolicy", "FxRateResult", "FxMatrix",
    "FxQuoteConvention", "FxPairConvention", "fx_market_pair", "fx_pair_convention",
    "fx_pip_size", "invert_fx_rate",
    "ScalarTimeSeries", "InflationIndex", "MarketContext",
]
note = "Subset scope: Rust-only market_data extras — the dividends, fixings, hierarchy, bumps and diff submodules, curve/surface builders (DiscountCurveBuilder etc.), ValidationMode, and the BasisSpreadCurve / ParametricCurve term structures — are deliberately unbound. Hosts construct curves through the bound constructors and apply bumps/diffs through the scenarios crate."

[crates.core.module_symbols.credit]
python_package = "finstack_quant.core.credit"
public = ["scoring", "pd", "lgd", "migration", "recovery_waterfall", "liability_management"]
note = "Subset scope: the Rust credit::registry submodule (market default assumptions, e.g. default_market_recovery_rate) is Rust-only; hosts inherit its values as builder defaults (e.g. HazardCurve recovery_rate) instead of querying the registry directly."

[crates.core.credit_migration_members]
"GeneratorMatrix.regularization_l1" = "regularization_l1"
"GeneratorMatrix.round_trip_error" = "round_trip_error"

[crates.core.module_symbols.rating_scales]
python_package = "finstack_quant.core.rating_scales"
public = [
    "UnknownScalePolicy", "RatingLevel", "ScorecardScale", "RatingScaleRegistry",
    "embedded_registry", "registry_from_config", "RATING_SCALES_EXTENSION_KEY",
]

[crates.core.module_symbols.table]
python_package = "finstack_quant.core.table"
public = [
    "ArrowTable",
]
note = "Subset scope: the canonical Rust core::table columnar envelope types (TableEnvelope and its schema/column companions) are not bound in any host — `ArrowTable` is the Python-side Arrow interop wrapper, not a binding of those types. The Rust envelope crosses host boundaries only as serialized JSON inside result payloads. No WASM parity (arrow-rs not built for wasm32)."

# ---------------------------------------------------------------------------
# finstack-quant-factor-model  →  finstack_quant.factor_model
# ---------------------------------------------------------------------------
[crates.factor_model]
rust_crate = "finstack-quant-factor-model"
rust_lib   = "finstack-quant/factor-model/src/lib.rs"
python_package = "finstack_quant.factor_model"
visibility = "pub"
status = "exists"
note = "Generic factor-model types are exported at the Rust crate root and cross host boundaries through JSON contracts; credit hierarchy APIs are exposed under finstack_quant.factor_model.credit. Known asymmetry: WASM handles (finstack-quant-wasm/src/api/factor_model/mod.rs) are toJson-only, while Python exposes typed accessors on CreditFactorModel/LevelsAtDate/PeriodDecomposition; this is an accepted host-language divergence, not drift."

[crates.factor_model.modules]
matching           = { python = "finstack_quant.factor_model.matching", status = "missing", note = "MatchingConfig typed host-language constructors deferred; JSON contracts remain Rust-owned. The crate-root matching re-exports (CascadeMatcher, HierarchicalMatcher, MappingTableMatcher, FactorMatcher trait family, MappingRule, AttributeFilter, DependencyFilter) are Rust-only." }
credit             = { python = "finstack_quant.factor_model.credit", status = "exists", note = "CreditFactorModel, CreditCalibrator, LevelsAtDate, PeriodDecomposition, FactorCovarianceForecast, decompose_levels, decompose_period. Rust submodules credit::calibration, credit::decomposition, and credit::hierarchy are flattened into this one Python namespace; their remaining Rust items (calibration internals, peel helpers, hierarchy node types) are Rust-only. FactorCovarianceForecast is bound here but its canonical Rust home is finstack-quant-portfolio::factor_model::credit_vol_forecast (cross-crate; see the portfolio section)." }
schema             = { python = "finstack_quant.factor_model.schema", status = "exists", note = "Compiled-in JSON Schema accessors; no WASM twin." }

# The crate-root `pub use` surface (FactorModelConfig, BumpSizeConfig,
# FactorBumpUnit, PricingMode, RiskMeasure, UnmatchedPolicy,
# FactorCovarianceMatrix, SensitivityMatrix, the envelope types, and the
# primitives FactorId/FactorType/FactorDefinition/MarketDependency/
# MarketMapping/CurveType/DependencyType) is Rust-only: hosts consume these
# through JSON contracts (factor_model.schema / covariance_at /
# factor_model_at), not as typed bindings.
[crates.factor_model.symbols]
public = []

[crates.factor_model.module_symbols.schema]
python_package = "finstack_quant.factor_model.schema"
public = [
    "credit_calibration_config_schema",
    "credit_calibration_inputs_schema",
    "credit_factor_model_schema",
    "factor_model_config_schema",
    "get",
    "index",
    "validate",
]

[wasm_factor_model_subset]
status = "explicit_subset"
note = "WASM factor_model exposes a single nested `credit` namespace mirroring finstack_quant.factor_model.credit (toJson-only handles; see the crate note). `schema` has no WASM twin."
js_export_file = "../finstack-quant-wasm/exports/factor_model.js"
root_exports = [
  "credit",
]
python_only = [
  "schema",
]

[wasm_factor_model_subset.python_js_map]
credit = "credit"

# ---------------------------------------------------------------------------
# finstack-quant-analytics  →  finstack_quant.analytics
# ---------------------------------------------------------------------------
[crates.analytics]
rust_crate = "finstack-quant-analytics"
rust_lib   = "finstack-quant/analytics/src/lib.rs"
python_package = "finstack_quant.analytics"
visibility = "pub"
status = "exists"
# NOTE: the Python surface for finstack-quant-analytics is intentionally flat — all
# functions and classes live directly under `finstack_quant.analytics` regardless of
# their Rust submodule. Submodules below are recorded for traceability, with
# status="flattened" signalling the agreed single-pathway convention rather
# than a missing shim.

[crates.analytics.modules]
aggregation  = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance.period_stats; freestanding bindings removed in paredown" }
benchmark    = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance.beta / .greeks / .rolling_greeks; freestanding bindings removed" }
correlation  = { python = "finstack_quant.valuations.correlation", status = "exists", note = "Rust-owned shared correlation infrastructure lives in finstack-quant-analytics; Python/WASM keep the historical valuations.correlation namespace" }
drawdown     = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance.max_drawdown / .mean_drawdown / .drawdown_series / .drawdown_details" }
lookback     = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance.lookback_returns" }
performance  = { python = "finstack_quant.analytics", status = "flattened", note = "Performance class is the sole entry point on finstack_quant.analytics. Known gap: Rust Performance::periodic_returns (the raw per-ticker (Date, f64) panel) is unbound in BOTH hosts — Python exposes only its DataFrame derivative periodic_returns_to_dataframe; WASM has no equivalent." }
regression   = { python = "finstack_quant.analytics", status = "flattened", note = "constrained_least_squares (Jeet & Partani 2023, Appendix A) exposed flat on finstack_quant.analytics; plain numeric list[float] API, no JSON envelope" }
returns      = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance constructors (prices) / Performance.from_returns. Naming exception: Python Performance.from_returns takes a DataFrame; the Rust-shaped (dates, returns, ticker_names) constructor is Performance.from_returns_arrays. Price-constructor asymmetry (parallel to the from_returns exception): Python Performance.new is DataFrame-first (a prices DataFrame) with the Rust-shaped (dates, prices, ticker_names) constructor as Performance.from_arrays; Rust and WASM expose only the array-shaped constructor (WASM `new Performance(dates, prices, tickerNames, ...)`)." }
risk_metrics = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance scalar methods (CAGR/Sharpe/Sortino/VaR/etc.)" }

[crates.analytics.symbols]
public = [
    "AnalyticsError",
    "BetaResult",
    "DatedSeries",
    "DrawdownEpisode",
    "GreeksResult",
    "LookbackReturns",
    "MultiFactorResult",
    "Performance",
    "PeriodStats",
    "RollingGreeks",
    "constrained_least_squares",
]

[wasm_analytics_subset]
status = "explicit_subset"
note = "WASM exposes the reusable Performance handle plus the standalone constrained regression needed by factor-Brinson attribution."
js_export_file = "../finstack-quant-wasm/exports/analytics.js"
root_exports = [
  "Performance",
  "constrainedLeastSquares",
]
# Python-only result/helper classes: WASM Performance methods return plain
# JS values/objects instead of these typed wrappers, so the classes have no
# WASM twin by design.
python_only = [
  "AnalyticsError",
  "BetaResult",
  "DatedSeries",
  "DrawdownEpisode",
  "GreeksResult",
  "LookbackReturns",
  "MultiFactorResult",
  "PeriodStats",
  "RollingGreeks",
]
# Class-method gap on the shared Performance class: eleven Python-only
# methods have no WASM twin — the two Rust-shaped array constructors
# (from_arrays, from_returns_arrays; WASM's `new` and `fromReturns` already
# take arrays, so the DataFrame/array constructor pair is a Python-only
# split) and the nine pandas exits (to_dataframe, summary_to_dataframe,
# returns_to_dataframe, cumulative_returns_to_dataframe,
# periodic_returns_to_dataframe, drawdown_series_to_dataframe,
# correlation_to_dataframe, drawdown_details_to_dataframe,
# lookback_returns_to_dataframe), which are DataFrame marshalling with no
# JS equivalent.
method_gaps_note = "Performance: from_arrays, from_returns_arrays, and all *_to_dataframe methods (incl. to_dataframe) are Python-only; Rust Performance::periodic_returns itself is unbound in both hosts."

[wasm_analytics_subset.python_js_map]
Performance = "Performance"
constrained_least_squares = "constrainedLeastSquares"

# ---------------------------------------------------------------------------
# finstack-quant-cashflows  →  finstack_quant.cashflows
# ---------------------------------------------------------------------------
[crates.cashflows]
rust_crate = "finstack-quant-cashflows"
rust_lib   = "finstack-quant/cashflows/src/lib.rs"
python_package = "finstack_quant.cashflows"
visibility = "pub"
status = "exists"
note = "Typed submodules (primitives/builder/accrual/aggregation) plus the JSON schedule bridge."

[crates.cashflows.modules]
json        = { python = "finstack_quant.cashflows",             status = "exists", note = "JSON bridge exposes the canonical coupon_program and payment_program builder surface. Naming note: the free function validate_cashflow_schedule_json wraps Rust json::validate_cashflow_schedule (schedule-typed free function); the typed twin is CashFlowSchedule.validate() on the builder surface — same validation, JSON vs typed entry." }
accrual     = { python = "finstack_quant.cashflows.accrual",     status = "exists", note = "Typed accrual engine; accrued_interest remains on the JSON bridge" }
aggregation = { python = "finstack_quant.cashflows.aggregation", status = "exists", note = "Typed period rollups and currency-checked totals. Rust-only (deliberately unbound): credit_adjusted_cashflow_pv, RecoveryTiming, and DateContext — a borrow-parameterized PV kernel consumed by valuations pricers, not a host-facing API." }
builder     = { python = "finstack_quant.cashflows.builder",     status = "exists", note = "Typed spec + builder + schedule surface; the JSON program bridge remains available on finstack_quant.cashflows" }
primitives  = { python = "finstack_quant.cashflows.primitives",  status = "exists", note = "Typed CashFlow/CFKind primitives; CashFlow rows also travel inside schedule JSON" }
schema      = { python = "finstack_quant.cashflows.schema",      status = "exists", note = "Compiled-in JSON Schema resources; package_cashflow_schema is doc(hidden) generator plumbing and stays Rust-only" }
traits      = { python = "finstack_quant.cashflows.traits",      status = "missing", note = "Rust-side trait surface; not meaningful as a Python module" }
# Rust `builder::` public submodules with no Python module twin. Their
# host-relevant types are re-exported at the Rust builder root and bound
# through finstack_quant.cashflows.builder; the submodules themselves stay
# Rust-only organization.
"builder.calendar"     = { python = "finstack_quant.cashflows.builder.calendar",     status = "missing", note = "Calendar resolution helpers for schedule generation; consumed internally by the builder pipeline" }
"builder.periods"      = { python = "finstack_quant.cashflows.builder.periods",      status = "missing", note = "SchedulePeriod is re-exported at the Rust builder root; period iteration stays Rust-only" }
"builder.rate_helpers" = { python = "finstack_quant.cashflows.builder.rate_helpers", status = "missing", note = "project_floating_rate / FloatingRateParams are Rust-only projection plumbing used by pricers" }
"builder.schedule"     = { python = "finstack_quant.cashflows.builder.schedule",     status = "missing", note = "CashFlowSchedule/CashFlowMeta are bound flat on finstack_quant.cashflows.builder; the Rust submodule path is not mirrored" }
"builder.specs"        = { python = "finstack_quant.cashflows.builder.specs",        status = "missing", note = "Spec types are bound flat on finstack_quant.cashflows.builder; the Rust submodule path is not mirrored" }

[crates.cashflows.module_symbols.primitives]
python_package = "finstack_quant.cashflows.primitives"
public = ["CFKind", "CashFlow", "is_cash_settlement_kind"]

[crates.cashflows.module_symbols.builder]
python_package = "finstack_quant.cashflows.builder"
# Rust-only builder-root re-exports (deliberately unbound, tracked here so the
# gap is a decision rather than drift): PeriodDataFrame/PeriodDataFrameOptions
# (Rust-side tabular envelope; Python builds DataFrames via
# CashFlowSchedule.to_dataframe), SchedulePeriod, project_floating_rate /
# FloatingRateParams (pricer plumbing), CashflowRepresentation /
# PvCreditAdjustment / PvDiscountSource (enum metadata carried inside schedule
# JSON), evaluate_fee_tiers / FeeTier / FixedWindow / DefaultCurve /
