[crates.scenarios.modules]
# Scenario symbols are exposed flat on finstack_quant.scenarios — the Rust crate's
# internal engine/spec/enums/reports partitioning is not surfaced as a
# separate Python import path to keep a single pathway.
#
# NOTE: ``finstack_quant.scenarios`` now exposes a typed authoring path alongside the
# original JSON helpers — ``OperationSpec`` (typed classmethod constructors,
# one per Rust enum variant), ``RateBindingSpec``, and the supporting enums
# (``CurveKind``, ``TenorMatchMode``, ``TimeRollMode``, ``Compounding``).
# Round-trip is delegated to serde on the Rust types so the
# wire contract (``tag = "kind"``, snake_case, with ``forward`` / ``par_cds``
# renames preserved) matches what the engine parses. These symbols remain flat
# on the package root rather than living under a ``spec`` submodule to keep a
# single pathway.
# (`adapters` and `utils` are pub(crate) in the Rust crate and therefore out
# of contract scope by the scoping rule; they are intentionally not listed.)
engine    = { python = "finstack_quant.scenarios",           status = "flattened", note = "ApplicationReport (typed) plus apply_scenario / apply_scenario_to_market are exported flat on finstack_quant.scenarios; ScenarioEngine, ExecutionContext, ApplicationEnvelope, and RollForwardReport remain Rust-only (reports cross the boundary as ApplicationResult / structured objects)" }
envelope  = { python = "finstack_quant.scenarios.envelope",  status = "missing", note = "Versioned persistence envelope (ScenarioEnvelope, ScenarioSchema, SCENARIO_CONTRACT) is bound in no host; Rust-only" }
error     = { python = "finstack_quant.scenarios.error",     status = "missing", note = "Scenario errors surface in Python as ValueError/RuntimeError text; no typed exception classes are bound" }
horizon   = { python = "finstack_quant.scenarios",           status = "flattened", note = "compute_horizon_return and the typed HorizonResult are exported flat on finstack_quant.scenarios; HorizonAnalysis (builder-style analyzer) remains Rust-only. Both hosts parse the attribution method through the canonical scenarios::horizon::attribution_method_from_str" }
spec      = { python = "finstack_quant.scenarios",           status = "flattened", note = "OperationSpec (typed classmethod constructors), RateBindingSpec, and the enums CurveKind/TenorMatchMode/TimeRollMode/Compounding are exported flat, alongside the ScenarioSpec JSON helpers (parse/build/compose/validate); the ScenarioSpec struct itself crosses the boundary only as JSON" }
templates = { python = "finstack_quant.scenarios",           status = "flattened", note = "Template registry access (list_builtin_templates, list_builtin_template_metadata, build_from_template, list_template_components, build_template_component) is exported flat; TemplateRegistry/RegisteredTemplate/ScenarioSpecBuilder types remain Rust-only" }
warning   = { python = "finstack_quant.scenarios.warning",   status = "missing", note = "The structured Warning enum is bound in no host; warnings surface as rendered strings plus warnings_json on report objects" }
schema = { python = "finstack_quant.scenarios.schema", status = "exists", note = "Registry-backed index/get/validate over the crate's published JSON Schemas; no WASM twin." }

# ExecutionContext limitation (both hosts): the binding entry points
