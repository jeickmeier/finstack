# ---------------------------------------------------------------------------
# finstack-quant-attribution  →  finstack_quant.attribution
# ---------------------------------------------------------------------------
[crates.attribution]
rust_crate = "finstack-quant-attribution"
rust_lib   = "finstack-quant/attribution/src/lib.rs"
python_package = "finstack_quant.attribution"
visibility = "pub"
status = "exists"

[crates.attribution.modules]
schema = { python = "finstack_quant.attribution.schema", status = "exists", note = "Registry-backed index/get/validate over the crate's published JSON Schemas; no WASM twin." }

[crates.attribution.symbols]
# Rust-only surface (deliberate, tracked as a decision rather than drift):
# the attribution crate exports a large typed decomposition API that hosts
# reach only through the string-dispatched `attribute_pnl` / JSON envelope
# entry points. The Rust-only categories are:
#   - typed decomposition entry points (attribute_pnl_waterfall / _taylor /
#     _parallel / _metrics_based, simple_pnl_bridge, compute_pnl helpers,
#     attribute_return_contribution_json)
#   - per-factor detail structs (CarryDetail, RatesCurvesAttribution,
#     CreditFactorAttribution, and the rest of types::detail) — reachable
#     from hosts as serde payloads on PnlAttribution detail getters
#   - spec/envelope/schema types (AttributionSpec, AttributionEnvelope,
#     AttributionResult(Envelope), AttributionSchema, AttributionConfig,
#     TaylorAttributionConfig) — hosts pass/receive them as JSON
#   - measure helpers and model-param shift utilities (extract_model_params,
#     measure_*_shift, with_model_params, MarketSnapshot/MarketRestoreFlags)
#   - return-contribution value types (spec/position/factor/group structs) —
#     hosts pass the spec as JSON and read the typed result wrapper
#   - the long-rows projection (LongDetailRow, pnl_attribution_long_rows and
#     siblings) — consumed by the Python DataFrame exports; not yet a
#     standalone host API
public = [
    "PnlAttribution",
    "ReturnContributionResult",
    "attribute_pnl",
    "attribute_pnl_from_spec",
    "attribute_return_contribution",
    "default_attribution_metrics",
    "default_waterfall_order",
    "validate_attribution_json",
    "validate_return_contribution_json",
]

[crates.attribution.module_symbols.schema]
python_package = "finstack_quant.attribution.schema"
public = ["get", "index", "validate"]

# WASM attribution subset
#
# Python exposes a richer `PnlAttribution` wrapper. WASM intentionally exposes
# the JSON/spec attribution surface through `exports/attribution.js` with
# camelCase facade names plus the wasm-bindgen params constructor.
#
# Panic containment asymmetry (intentional): the WASM binding wraps
# attribution execution in catch_unwind because an uncaught unwind at the
# wasm boundary aborts the whole module instance, killing every subsequent
# call from the JS host. Python does not need the wrapper — pyo3 converts an
# unwind into a PanicException without poisoning the interpreter.
# ---------------------------------------------------------------------------
[wasm_attribution_subset]
rust_module_root = "../finstack-quant-wasm/src/api/attribution/"
js_export_file   = "../finstack-quant-wasm/exports/attribution.js"
root_exports = [
    "AttributionParams",
    "attributePnl",
    "attributePnlFromSpec",
    "attributePnlJson",
    "defaultAttributionMetrics",
    "defaultWaterfallOrder",
    "validateAttributionJson",
]
# Python-only attribution surface: the typed result wrappers, the
# return-contribution subsystem, and the schema submodule have no WASM twin.
# The long-format detail-row projection (Rust LongDetailRow /
# pnl_attribution_long_rows, surfaced as PnlAttribution.to_long_dataframe and
# siblings) is likewise python_only — WASM does not yet expose it.
python_only = [
    "PnlAttribution",
    "ReturnContributionResult",
    "attribute_return_contribution",
    "schema",
    "validate_return_contribution_json",
]

[wasm_attribution_subset.python_js_map]
attribute_pnl = "attributePnl"
attribute_pnl_from_spec = "attributePnlFromSpec"
default_attribution_metrics = "defaultAttributionMetrics"
default_waterfall_order = "defaultWaterfallOrder"
validate_attribution_json = "validateAttributionJson"

[wasm_attribution_subset.wasm_only]
symbols = ["AttributionParams", "attributePnlJson"]

