# Per-namespace Python-only symbols (no WASM twin) for the shared
# `instruments` namespace. Documentation-grade accounting mirroring the
# root-level `python_only` list; entries here must appear in
# [crates.valuations.instruments].public.
#
# Known asymmetry (pending WASM typed wrappers): Python has full typed
# instrument families — rates (InterestRateSwap/Swaption/CapFloor), credit
# (CreditDefaultSwap/CDSIndex/CDSTranche), equity
# (EquityOption/ConvertibleBond), legs (FixedLegSpec/FloatLegSpec/
# PremiumLegSpec/ProtectionLegSpec), and structured credit (StructuredCredit
# + component types) — while WASM reaches these products through JSON-first
# entry points only. The old "structured credit is JSON-only in both hosts"
# note is stale: Python grew typed wrappers in 2026-06; WASM has not.
#
# `Bond.price_merton_mc` and the whole Merton-MC family (MertonMcConfig/
# MertonMcResult/PathStatistics/PikMode/PikSchedule) are deliberately
# Python-only: MC pricing is not being ported to the WASM facade.
