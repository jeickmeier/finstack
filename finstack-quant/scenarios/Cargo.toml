[package]
name = "finstack-quant-scenarios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Deterministic scenario DSL for Finstack Quant with preview, composition, and phase-ordered apply across market/statements/valuations"
autobenches = false

[dependencies]
finstack-quant-attribution = { path = "../attribution", version = "0.7.0" }
finstack-quant-core = { path = "../core", version = "0.7.0" }
finstack-quant-statements = { path = "../statements", version = "0.7.0" }
finstack-quant-valuations = { path = "../valuations", version = "0.7.0" }
indexmap = { workspace = true, features = ["serde"] }
rayon = "1.11"
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["macros"] }
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
criterion = { workspace = true }
jsonschema = { version = "0.28", default-features = false }

[[bin]]
name = "gen_scenario_schemas"
path = "src/bin/gen_schemas.rs"

[[bench]]
name = "scenarios"
harness = false

[[bench]]
name = "scenarios_scaling"
harness = false

[lints]
workspace = true
