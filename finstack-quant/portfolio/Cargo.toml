[package]
name = "finstack-quant-portfolio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Portfolio aggregation for Finstack Quant: positions, books, and deterministic base-currency rollups with explicit FX policy"
autobenches = false

[dependencies]
finstack-quant-core = { path = "../core", version = "0.7.0" }
finstack-quant-attribution = { path = "../attribution", version = "0.7.0" }
finstack-quant-cashflows = { path = "../cashflows", version = "0.7.0" }
finstack-quant-margin = { path = "../margin", version = "0.7.0" }
finstack-quant-valuations = { path = "../valuations", version = "0.7.0" }
finstack-quant-factor-model = { path = "../factor-model", version = "0.7.0" }
finstack-quant-scenarios = { path = "../scenarios", version = "0.7.0" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
schemars = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
tracing = "0.1"
time = { workspace = true, features = ["macros", "serde", "parsing", "formatting"] }
rayon = "1.11"
good_lp = { version = "1.15", default-features = false, features = ["microlp"] }
ts-rs = { version = "12", optional = true, features = ["serde-compat", "no-serde-warnings"] }

[features]
default = []
ts_export = ["dep:ts-rs", "finstack-quant-core/ts_export"]

[dev-dependencies]
criterion = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
jsonschema = { version = "0.28", default-features = false }
smallvec = { version = "1.15", default-features = false }

[[bench]]
name = "portfolio_valuation"
harness = false

[[bench]]
name = "portfolio_cashflows"
harness = false

[[bench]]
name = "portfolio_metrics"
harness = false

[[bench]]
name = "portfolio_attribution"
harness = false

[[bench]]
name = "parallel_thresholds"
harness = false

[[bench]]
name = "sensitivity_simulation"
harness = false

[[bench]]
name = "portfolio_workflows"
harness = false

[[bench]]
name = "materialization"
harness = false

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
