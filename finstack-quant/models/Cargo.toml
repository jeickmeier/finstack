[package]
name = "finstack-quant-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reusable analytical, numerical, credit, correlation, and stochastic models for quantitative finance"
autobenches = false

[dependencies]
finstack-quant-core = { path = "../core", version = "0.7.0" }
finstack-quant-analytics = { path = "../analytics", version = "0.7.0" }
finstack-quant-cashflows = { path = "../cashflows", version = "0.7.0" }
indexmap = { workspace = true, features = ["serde"] }
smallvec = { version = "1.15", default-features = false, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
statrs = { version = "0.18", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
rayon = "1.11"
rand = { version = "0.9.3", default-features = false, features = ["std"] }
rand_pcg = { version = "0.9", features = ["serde"] }
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
time = { workspace = true }
rust_decimal = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
num-complex = "0.4"
strum = { workspace = true, features = ["derive"] }
ts-rs = { version = "12", optional = true, features = ["serde-compat", "no-serde-warnings"] }

[features]
default = []
ts_export = ["dep:ts-rs"]

[dev-dependencies]
criterion = { workspace = true }
finstack-quant-test-utils = { path = "../test-utils", version = "0.7.0" }
jsonschema = { version = "0.28", default-features = false }
proptest = "1.11.0"
time = { workspace = true, features = ["macros"] }
toml = "1.1.4"

[[bench]]
name = "mc_hot_paths"
harness = false

[[bench]]
name = "fourier_pricing"
harness = false

[[bench]]
name = "migration_matrix"
harness = false

[[bench]]
name = "factor_model"
path = "benches/factor/factor_model.rs"
harness = false

[[bench]]
name = "factor_model_scale"
path = "benches/factor/factor_model_scale.rs"
harness = false

[[bench]]
name = "liquidity"
harness = false

[[bin]]
name = "gen_factor_model_schemas"
path = "src/bin/gen_factor_model_schemas.rs"

[lints]
workspace = true
