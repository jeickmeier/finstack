[package]
name = "finstack-quant-factor-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Factor model framework for Finstack Quant with hierarchical credit factor decomposition and offline calibration"
autobenches = false

[dependencies]
finstack-quant-core = { path = "../core", version = "0.7.0" }
finstack-quant-analytics = { path = "../analytics", version = "0.7.0" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
jsonschema = { version = "0.28", default-features = false }
proptest = "1.11.0"
time = { workspace = true, features = ["macros"] }

[[bin]]
name = "gen_factor_model_schemas"
path = "src/bin/gen_schemas.rs"

[[bench]]
name = "factor_model"
harness = false

[lints]
workspace = true
