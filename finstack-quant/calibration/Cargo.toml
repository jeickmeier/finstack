[package]
name = "finstack-quant-calibration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Quote ingestion, market construction, calibration, and cached recalibration for Finstack Quant"
autobenches = false

[dependencies]
finstack-quant-core = { path = "../core", version = "0.8.0" }
finstack-quant-models = { path = "../models", version = "0.8.0", default-features = false }
finstack-quant-cashflows = { path = "../cashflows", version = "0.8.0" }
finstack-quant-valuations = { path = "../valuations", version = "0.8.0" }
indexmap = { workspace = true, features = ["serde"] }
smallvec = { version = "1.15", default-features = false, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
time = { workspace = true }
rust_decimal = { workspace = true }
schemars = { workspace = true }
jsonschema = { version = "0.28", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
rayon = "1.11"
thiserror = { workspace = true }
num-complex = "0.4"
strum = { workspace = true, features = ["derive"] }
ts-rs = { version = "12", optional = true, features = ["serde-compat", "no-serde-warnings"] }

[dev-dependencies]
time = { workspace = true, features = ["macros"] }
proptest = "1.11.0"
criterion = { workspace = true }
rust_decimal_macros = { workspace = true }
toml = "1.1.4"

[features]
default = []
ts_export = ["dep:ts-rs", "finstack-quant-models/ts_export", "finstack-quant-valuations/ts_export"]

[[bench]]
name = "calibration"
harness = false

[[bench]]
name = "global_calibration"
harness = false

[[bench]]
name = "credit_factor_calibration"
harness = false

[[bench]]
name = "df_bootstrap"
harness = false

[[bench]]
name = "fwd_curve"
harness = false

[[bench]]
name = "sabr_slice"
harness = false

[[bin]]
name = "gen_calibration_schemas"
path = "src/bin/gen_schemas.rs"

[lints]
workspace = true
