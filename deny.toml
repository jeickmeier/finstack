# cargo-deny configuration for finstack-quant workspace
# See https://embarkstudios.github.io/cargo-deny/ for full documentation

[graph]
# Enable workspace-level checks
all-features = true

[advisories]
# Check for security vulnerabilities in dependencies
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # Transitive via nalgebra/simba; no safe upgrade path published by advisory.
    "RUSTSEC-2024-0436", # paste (unmaintained)
    # Unused optional dep of rust_decimal (rkyv feature off). 0.7 unsupported;
    # blocked on paupino/rust-decimal#818/#819. Mirrored in osv-scanner.toml.
    "RUSTSEC-2026-0235", # rkyv (unused optional via rust_decimal)
]

[licenses]
# Allow MIT, Apache-2.0, and compatible licenses
version = 2
# Keep the full permissive-license allow-list even when current deps don't use
# every entry; this avoids churn when transitive deps rotate licenses.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8
# tiny-keccak (CC0-1.0) is reachable only through arrow-array's wasm32-only
# `ahash/compile-time-rng` feature (every other target uses `runtime-rng`,
# which never pulls in tiny-keccak). `cargo tree -e normal -i tiny-keccak`
# finds no edge into the host dependency graph, so it never compiles into
# anything this workspace actually builds. Cargo.lock/cargo-deny resolve
# target-cfg'd deps unconditionally (this workspace also builds
# finstack-quant-wasm for wasm32), which is why it surfaces here at all.
# Scoped to this one crate; CC0-1.0 stays disallowed globally.
exceptions = [
    { allow = ["CC0-1.0"], name = "tiny-keccak" },
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
# Deny multiple versions of the same crate (with some exceptions)
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

# Skip duplicate version check for transitive dependencies we don't control.
skip = [
    # `lru 0.16.4` still uses hashbrown 0.16, while indexmap/schemars moved to
    # hashbrown 0.17. Remove once `lru` upgrades.
    { name = "hashbrown", version = "=0.16.1" },
]

skip-tree = []

[sources]
# Only allow crates from crates.io and git repositories
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
