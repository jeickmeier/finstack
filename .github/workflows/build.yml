name: Build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Managed toolchain versions are pinned in mise.toml.
# CI uses jdx/mise-action@v4 to provision them, then runs canonical mise tasks.

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  # ============================================
  # Prime mise cache — single writer to avoid parallel
  # `actions/cache/save` races across jobs that share the
  # same mise.toml-derived cache key. All other jobs read
  # from this cache with `cache_save: false`.
  # ============================================
  prime-cache:
    name: Prime mise cache
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true

  # ============================================
  # Lint — pre-commit checks (runs in parallel with tests)
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 1
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols -C linker=cc -C link-arg=-fuse-ld=bfd"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true
          cache_save: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Ensure rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - name: Install WASM dependencies
        run: npm ci --ignore-scripts
        working-directory: finstack-quant-wasm

      - name: Set up Python environment
        run: |
          uv venv --python 3.12
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --no-install-project

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit checks
        run: |
          uv run pre-commit run --all-files
          uv run pre-commit run --all-files --hook-stage pre-push

      - name: Check generated schemas and bindings
        run: mise run gen-check

  # ============================================
  # Test Rust — cargo nextest
  # ============================================
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 1
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols -C linker=cc -C link-arg=-fuse-ld=bfd"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Run Rust lib and integration tests
        run: mise run rust-test

  # ============================================
  # Rust MSRV — compile production targets with the declared minimum toolchain
  # ============================================
  rust-msrv:
    name: Rust MSRV (1.90)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 1
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols -C linker=cc -C link-arg=-fuse-ld=bfd"
      PYO3_PYTHON: python3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Provision current toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true
          cache_save: false

      - name: Set up Python 3.12 for PyO3
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust 1.90
        run: rustup toolchain install 1.90 --profile minimal

      - name: Check declared MSRV
        run: mise run rust-msrv

  # ============================================
  # Rust release build — current toolchain production-build ownership
  # ============================================
  rust-release-build:
    name: Rust release build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 1
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols -C linker=cc -C link-arg=-fuse-ld=bfd"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Provision current toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true
          cache_save: false

      - name: Build production Rust artifacts
        run: mise run rust-build-prod

  # ============================================
  # Test Python — maturin build + pytest
  # ============================================
  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 1
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols -C linker=cc -C link-arg=-fuse-ld=bfd"
      PYO3_PYTHON: python3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Set up Python environment
        run: |
          uv venv --python 3.12
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --no-install-project

      - name: Build extension and run Python tests
        run: mise run python-test-all

  # ============================================
  # Test WASM — wasm-pack build + test
  # ============================================
  test-wasm:
    name: Test WASM
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 1
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols -C linker=cc -C link-arg=-fuse-ld=bfd"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install WASM dependencies
        run: npm ci --ignore-scripts
        working-directory: finstack-quant-wasm

      - name: Run WASM tests
        run: mise run wasm-test


  # ============================================
  # Supply-chain security (cargo-deny): Rust advisories, licenses, bans
  # ============================================
  supply-chain:
    name: Supply-chain Security (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prime-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true
          cache_save: false

      - name: Run cargo-deny
        run: mise run rust-audit

  # ============================================
  # Rust publish packaging checks
  # ============================================
  rust-publish-checks:
    name: Rust Publish Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: prime-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true
          cache_save: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Validate Rust crate publish order
        run: mise run rust-publish-checks

  # ============================================
  # Supply-chain security (OSV-Scanner): cross-ecosystem CVE scan
  # Covers Cargo.lock, uv.lock, and package-lock.json against the OSV database.
  # Uses the PR-diff reusable workflow on pull_request (only reports newly
  # introduced vulns) and the full-scan reusable workflow on push to master.
  # ============================================
  osv-scan-pr:
    name: Supply-chain Security (OSV-Scanner, PR diff)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.5
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # Explicit lockfiles (stable; avoids walking into .worktree/ or other sibling checkouts).
      scan-args: |-
        --lockfile=Cargo.lock
        --lockfile=uv.lock
        --lockfile=finstack-quant-wasm/package-lock.json

  osv-scan-full:
    name: Supply-chain Security (OSV-Scanner, full)
    if: github.event_name == 'push'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.5
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --lockfile=Cargo.lock
        --lockfile=uv.lock
        --lockfile=finstack-quant-wasm/package-lock.json

  # ============================================
  # Semver checks for API stability
  # ============================================
  semver-checks:
    name: Semver Checks
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: github.event_name == 'pull_request'
    needs: [prime-cache, lint, test-rust, test-python, test-wasm]

    env:
      CARGO_BUILD_JOBS: 2
      RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"

    steps:
      - name: Checkout repository (full history for baseline)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true
          cache_save: false

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      # Semver-check the stable public-API crates.
      - name: Run semver checks against master
        run: |
          git fetch origin master --tags
          cargo semver-checks check-release \
            -p finstack-quant-core \
            -p finstack-quant-valuations \
            -p finstack-quant-portfolio \
            --baseline-rev origin/master
