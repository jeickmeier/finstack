# Finstack Quant developer environment & tasks
# ---------------------------------------
# Single source of truth for managed tool versions and developer tasks.
# Run `mise install` once to provision all tools, then `mise run <task>`
# (or `mise r <task>`) to drive the workflow. `mise tasks` lists everything.
#
# Naming convention: <domain>-<action>  (domains: rust, python, wasm, all)
#   - `rust-*`, `python-*`, `wasm-*`  — single-language tasks
#   - `all-*`                          — aggregates that fan out to all domains
#   - `*-fmt`                          — reformats AND applies auto-fixes (mutating)
#   - `*-lint`                         — check-only (CI-safe, no mutation)

[tools]
rust = { version = "1.91", components = "clippy,rustfmt", targets = "wasm32-unknown-unknown", profile = "minimal" }
node = "24"
"aqua:rustwasm/wasm-pack" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-public-api" = "latest"
"cargo:maturin" = "latest"
"aqua:google/osv-scanner" = "2.3.5"

[env]
CARGO_INCREMENTAL = "{{ env.CARGO_INCREMENTAL | default(value='1') }}"
CARGO_HOME = "{{ env.CARGO_HOME | default(value=env.HOME ~ '/.cargo') }}"
RUSTUP_HOME = "{{ env.RUSTUP_HOME | default(value=env.HOME ~ '/.rustup') }}"
UV_PYTHON_DOWNLOADS = "{{ env.UV_PYTHON_DOWNLOADS | default(value='never') }}"

# ─────────────────────────────────────────────────────────────────
# Aggregate (all-*) — fan out across rust + python + wasm
# ─────────────────────────────────────────────────────────────────

[tasks.all]
description = "Build, test, and lint everything (rust + python + wasm)"
run = [{ task = "all-build" }, { task = "all-test" }, { task = "all-lint" }]

[tasks.all-build]
description = "Build Rust workspace, Python bindings, and WASM package"
depends = ["rust-build", "python-build", "wasm-build"]

[tasks.all-test]
description = "Run all tests (Rust + Python + WASM)"
run = [
  { task = "rust-test" },
  { task = "python-test-all" },
  { task = "wasm-test" },
]

[tasks.goldens-test]
description = "Run golden tests (Rust + Python layers)"
run = """
cargo test -p finstack-quant-valuations --test golden -- --include-ignored &&
mise run python-build &&
uv run pytest finstack-quant-py/tests/golden -v
"""

[tasks.goldens-test-strict]
description = "Run golden tests ignoring known_non_executable.json (surface every failure)"
env = { GOLDEN_IGNORE_NON_EXECUTABLE = "1" }
run = """
cargo test -p finstack-quant-valuations --test golden -- --include-ignored &&
mise run python-build &&
uv run pytest finstack-quant-py/tests/golden -v
"""

[tasks.goldens-quantlib-generate]
description = "Regenerate committed native QuantLib golden fixtures"
run = "uv run python -m scripts.golden.quantlib.generate --product all"

[tasks.goldens-quantlib-check]
description = "Check native QuantLib golden fixtures for generator drift"
run = "uv run python -m scripts.golden.quantlib.generate --product all --check"

[tasks.all-fmt]
description = "Format + auto-fix Rust, Python, and WASM code (mutating)"
depends = ["rust-fmt", "python-fmt", "wasm-fmt"]

[tasks.all-lint]
description = "Lint Rust + Python + WASM (check-only, non-mutating)"
depends = ["rust-lint", "python-lint", "wasm-lint", "wasm-doc", "gen-check"]

[tasks.all-audit]
description = "Run security audits on Rust + Python"
depends = ["rust-audit", "python-audit"]

[tasks.assumptions-audit]
description = "Report hard-coded external assumptions that should move to registries"
run = "python3 scripts/audit_hardcoded_assumptions.py"

[tasks.all-update]
description = "Update Rust + Python dependencies"
depends = ["rust-update", "python-update"]

[tasks.all-clean]
description = "Remove build artifacts and virtualenvs"
run = ["cargo clean", '''python3 scripts/clean_workspace.py''']

[tasks.all-doc]
description = "Verify Rust, Python, and WASM documentation (CI docs job)"
depends = ["rust-doc", "python-doc", "wasm-doc", "materialization-benchmark-doc-check"]

[tasks.all-ci]
description = "Run CI build.yml checks locally (lint, tests, docs, cargo-deny, publish checks)"
depends = [
  "pre-commit-run",
  "gen-check",
  "all-test",
  "all-doc",
  "rust-audit",
  "rust-publish-checks",
]

# ─────────────────────────────────────────────────────────────────
# Rust
# ─────────────────────────────────────────────────────────────────

[tasks.rust-build]
description = "Build all core Rust crates (excludes finstack-quant-py, finstack-quant-wasm)"
run = "cargo build --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm"

[tasks.rust-build-prod]
description = "Release build without debug info"
env = { RUSTFLAGS = "-C debuginfo=0" }
run = "cargo build --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm --release"

[tasks.rust-test]
# `--exclude finstack-quant-py` is required, not an oversight: building that crate's
# test target links against libpython (e.g. `ld: library 'python3.9' not found`), which
# is not available in a plain `cargo` environment. The crate has no Rust `#[test]`s
# anyway — its behaviour is covered by pytest via `mise run python-test`.
# Type-checking it is still gated: `rust-lint` runs clippy with `--workspace`, and
# clippy type-checks without linking, so binding compile errors are caught there.
description = "Run Rust tests via cargo-nextest"
run = "cargo nextest run --workspace --exclude finstack-quant-py --lib --test '*' --no-fail-fast"

[tasks.rust-doc]
description = "Build workspace docs, enforce input docs, and run contract doctests"
run = [
  "RUSTDOCFLAGS='-D warnings' cargo doc --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm --no-deps",
  "uv run python scripts/check_public_api_input_docs.py",
  "uv run python scripts/check_deprecated_annotations.py",
  "cargo test -p finstack-quant-core --doc",
  "cargo test -p finstack-quant-portfolio --doc",
]

[tasks.rust-test-slow]
description = "Run Rust tests including ignored/slow ones"
run = "cargo nextest run --workspace --exclude finstack-quant-py --lib --test '*' --run-ignored all --no-fail-fast"

[tasks.rust-test-cov]
description = "Run Rust tests with HTML coverage report"
run = """
mkdir -p target/llvm-cov/profraw
LLVM_PROFILE_FILE="$PWD/target/llvm-cov/profraw/default_%m_%p.profraw" \
  cargo llvm-cov --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm \
    --ignore-filename-regex '(tests?/|target/|\\.cargo/|.*finstack-quant-py/.*|.*finstack-quant-wasm/.*)' \
    --html --output-dir target/llvm-cov
echo "HTML report: target/llvm-cov/html/index.html"
"""

[tasks.rust-fmt]
# `--workspace` keeps the mutating pass in step with `rust-lint`'s check-only pass;
# without it, auto-fixes would skip the binding crates that rust-lint now gates on.
description = "Format + auto-fix Rust code (cargo fmt + clippy --fix, mutating)"
run = [
  "cargo fmt --all",
  "cargo clippy --workspace --all-targets --fix --allow-dirty -- -D warnings",
]

[tasks.rust-lint]
# `-D warnings` matches the CI pre-commit hook (.pre-commit-config.yaml) so that a
# green local run implies a green CI run.
#
# `--workspace` is deliberate: a bare `cargo clippy` operates on `default-members`,
# which omits finstack-quant-py and finstack-quant-wasm. That blind spot let a
# breaking change land on master with a Python binding that did not compile
# (a struct gained a field; the binding's struct-literal call site was not updated).
# `cargo fmt --all` already covered those crates, and the `cargo check --workspace`
# pre-commit hook would have caught it but only runs at the pre-push stage.
# Clippy type-checks, so linting the whole workspace closes the gap at commit time.
description = "Lint Rust (fmt --check + clippy with -D warnings, check-only)"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.rust-audit]
description = "Audit Rust dependencies via cargo-deny"
run = "cargo deny check"

[tasks.rust-semver-checks]
description = "Compare the umbrella Rust crate against the v0.6.0 baseline"
run = "python3 scripts/semver_checks.py"

[tasks.rust-publish-checks]
description = "Validate Rust crate publish order and first-crate dry-run"
run = "uv run --no-sync python scripts/cargo_publish_checks.py"

[tasks.rust-update]
description = "Update Rust dependencies"
run = "cargo update"

# ─────────────────────────────────────────────────────────────────
# Python
# ─────────────────────────────────────────────────────────────────

[tasks.python-setup]
description = "Initialize Python virtual environment"
run = "uv venv --python 3.12 --allow-existing"

[tasks.python-sync]
description = "Sync Python dev dependencies (uv sync --group dev)"
run = "uv sync --group dev"

[tasks.python-build]
description = "Build Python bindings in-place (pass --release for optimized build)"
usage = '''
flag "--release" help="Build with release profile (slower compile, faster runtime)"
'''
run = 'uv run maturin develop{% if usage.release %} --release{% endif %}'

[tasks.materialization-benchmark-fixtures]
description = "Generate deterministic portfolio materialization benchmark fixtures"
run = "cargo run --release --quiet -p finstack-quant-portfolio --example materialization_fixtures -- target/materialization-benchmarks"

[tasks.python-bench-portfolio]
description = "Benchmark portfolio Python bindings with an optimized extension"
run = """
mise run materialization-benchmark-fixtures
mise run python-build -- --release
uv run pytest finstack-quant-py/benchmarks/bench_bindings.py \
  -m perf --benchmark-only -k Portfolio
"""

[tasks.wasm-bench-materialization]
description = "Regenerate fixtures, release-build WASM, and benchmark materialization"
run = """
mise run materialization-benchmark-fixtures
npm --prefix finstack-quant-wasm run build:node
npm --prefix finstack-quant-wasm run bench -- --materialization-only
"""

[tasks.python-bench-portfolio-baseline]
description = "Explicitly establish immutable Python baseline; set FQ_REPLACE_MATERIALIZATION_BASELINE=1 to replace"
run = """
replace_flag=$(uv run python scripts/materialization_baseline_replace_flag.py)
uv run python scripts/check_python_materialization_regressions.py guard \
  --baseline docs/benchmarks/materialization-python-baseline.json \
  $replace_flag
mise run materialization-benchmark-fixtures
mise run python-build -- --release
uv run python scripts/check_python_materialization_regressions.py prepare \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --output target/materialization-python/baseline-run-metadata.json
FQ_MATERIALIZATION_P95_SAMPLES=${FQ_MATERIALIZATION_P95_SAMPLES:-100} \
uv run python finstack-quant-py/benchmarks/materialization_measure.py \
  target/materialization-benchmarks target/materialization-python/baseline-measurement.json
uv run python scripts/check_python_materialization_regressions.py establish \
  --measurement target/materialization-python/baseline-measurement.json \
  --run-metadata target/materialization-python/baseline-run-metadata.json \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --output docs/benchmarks/materialization-python-baseline.json \
  --artifact-root target/materialization-python \
  --baseline-name python-materialization-v1 \
  $replace_flag
uv run python scripts/check_python_materialization_regressions.py seal \
  --baseline docs/benchmarks/materialization-python-baseline.json \
  --manifest docs/materialization-benchmark-baseline.json
"""

[tasks.python-bench-portfolio-compare]
description = "Strictly compare fresh release-Python materialization measurements"
run = """
current_output=${FQ_MATERIALIZATION_PYTHON_CURRENT_OUTPUT:-target/materialization-python/current.json}
result_output=${FQ_MATERIALIZATION_PYTHON_COMPARISON_OUTPUT:-target/materialization-python/comparison.json}
mise run materialization-benchmark-fixtures
mise run python-build -- --release
uv run python scripts/prepare_materialization_criterion_run.py \
  --baseline docs/benchmarks/materialization-python-baseline.json \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --output target/materialization-python/run-metadata.json
FQ_MATERIALIZATION_P95_SAMPLES=${FQ_MATERIALIZATION_P95_SAMPLES:-100} \
uv run python finstack-quant-py/benchmarks/materialization_measure.py \
  target/materialization-benchmarks "$current_output"
uv run python scripts/check_python_materialization_regressions.py compare \
  --baseline docs/benchmarks/materialization-python-baseline.json \
  --current "$current_output" \
  --run-metadata target/materialization-python/run-metadata.json \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --artifact-root target/materialization-python \
  --result-output "$result_output" \
  --baseline-manifest docs/materialization-benchmark-baseline.json \
  --threshold 0.10
"""

[tasks.python-test]
description = "Build dev Python bindings, then run fast Python tests"
run = """
mise run python-build
uv run pytest -v -m 'not slow'
"""

[tasks.python-test-slow]
description = "Build dev Python bindings, then run slow Python tests"
run = """
mise run python-build
uv run pytest -v -m slow
"""

[tasks.python-test-all]
description = "Build dev Python bindings, then run the full Python test suite"
run = """
mise run python-build
uv run pytest -v
"""

[tasks.python-test-cov]
description = "Build dev Python bindings, then run Python tests with HTML coverage report"
run = """
mise run python-build
uv run pytest -v --cov=finstack-quant-py/finstack_quant --cov-report=term-missing --cov-report=html:target/python-cov
"""

[tasks.python-fmt]
description = "Format + auto-fix Python code (ruff format + ruff check --fix, mutating)"
run = [
  "uv run --no-sync ruff format .",
  "uv run --no-sync ruff check . --fix --unsafe-fixes",
]

[tasks.python-lint]
description = "Lint Python (ruff format --check + ruff check, check-only)"
run = [
  "uv run --no-sync ruff format . --check",
  "uv run --no-sync ruff check . --no-fix",
  "uv run --no-sync python scripts/check_python_api_input_docs.py",
]

[tasks.python-doc]
description = "Enforce complete Python IntelliSense documentation"
run = "uv run --no-sync python scripts/check_python_api_input_docs.py"

[tasks.python-typecheck]
description = "Type-check Python bindings with ty"
run = "uv run --no-sync ty check finstack-quant-py/finstack_quant"

[tasks.python-audit]
description = "Audit Python dependencies via bandit"
run = "uv run bandit -r finstack-quant-py -c pyproject.toml"

[tasks.python-update]
description = "Update Python dependencies"
run = "uv lock --upgrade"

[tasks.python-examples]
description = "Run Python example notebooks"
run = "uv run python finstack-quant-py/examples/notebooks/run_all_notebooks.py"

# ─────────────────────────────────────────────────────────────────
# WASM
# ─────────────────────────────────────────────────────────────────

[tasks.wasm-build]
description = "Build WASM package (web target)"
run = "wasm-pack build finstack-quant-wasm --target web"

[tasks.wasm-test]
description = "Run WASM package tests (wasm-bindgen + Node facade)"
run = [
  "npm --prefix finstack-quant-wasm run test",
  "npm --prefix finstack-quant-wasm run build",
  "npm --prefix finstack-quant-wasm run build:node",
  "npm --prefix finstack-quant-wasm run test:facade",
]

[tasks.wasm-test-cov]
description = "Run WASM binding tests with HTML coverage report"
run = """
mkdir -p target/wasm-cov/profraw
LLVM_PROFILE_FILE="$PWD/target/wasm-cov/profraw/default_%m_%p.profraw" \
  cargo llvm-cov -p finstack-quant-wasm --lib \
    --ignore-filename-regex '(tests?/|target/|\\.cargo/)' \
    --html --output-dir target/wasm-cov
echo "HTML report: target/wasm-cov/html/index.html"
"""

[tasks.wasm-fmt]
description = "Format + auto-fix WASM/TS code (prettier + eslint --fix, mutating)"
run = [
  "npm --prefix finstack-quant-wasm run format:fix",
  "npm --prefix finstack-quant-wasm run lint:fix",
]

[tasks.wasm-lint]
description = "Lint WASM/TS code (prettier --check + eslint, check-only)"
run = [
  "npm --prefix finstack-quant-wasm run format",
  "npm --prefix finstack-quant-wasm run lint",
  "uv run python scripts/check_wasm_api_input_docs.py",
]

[tasks.wasm-doc]
description = "Enforce complete WASM and TypeScript IntelliSense documentation"
run = [
  "uv run python scripts/check_wasm_api_input_docs.py",
  "npm --prefix finstack-quant-wasm run docs:check",
]

[tasks.wasm-pkg]
description = "Build WASM package (web + node targets)"
run = [
  "wasm-pack build finstack-quant-wasm --target web --release --out-dir pkg",
  "wasm-pack build finstack-quant-wasm --target nodejs --release --out-dir pkg-node",
  '''uv run python -c "from pathlib import Path; [Path(p).touch() for p in ('finstack-quant-wasm/pkg/.npmignore', 'finstack-quant-wasm/pkg-node/.npmignore')]"''',
]

[tasks.wasm-gen-bindings]
description = "Export TypeScript types from Rust (writes finstack-quant-wasm/types/generated/)"
run = [
  "cargo test -p finstack-quant-valuations --test integration --features ts_export -- schema::ts_export --test-threads=1",
  "cargo test -p finstack-quant-portfolio --test ts_export --features ts_export",
  "uv run --no-sync python scripts/sync_generated_ts_index.py",
]

[tasks.wasm-check-bindings]
description = "Verify Rust-exported TypeScript types without mutating the workspace"
run = "uv run --no-sync python scripts/check_generated_ts.py"

# ─────────────────────────────────────────────────────────────────
# Packaging (wheels)
# ─────────────────────────────────────────────────────────────────

[tasks.wheel-local]
description = "Build wheel for current platform + Python"
run = "uv run maturin build --release -o target/wheels"

[tasks.wheel-all]
description = "Build wheels for all locally-available Python versions"
run = "uv run maturin build --release --find-interpreter -o target/wheels"

# ─────────────────────────────────────────────────────────────────
# Schemas
# ─────────────────────────────────────────────────────────────────

[tasks.rust-serde-audit]
description = "Audit public Rust contract types for serde and JsonSchema coverage"
run = [
  "uv run pytest scripts/tests/test_serde_audit.py -q",
  "uv run python scripts/serde_audit.py --check",
]

[tasks.rust-check-schemas]
description = "Verify JSON schemas match Rust types"
run = [
  "mise run rust-serde-audit",
  "uv run --no-sync python scripts/check_schema_residue.py",
  "cargo run -p finstack-quant-attribution --bin gen_attribution_schemas -- --check",
  "cargo run -p finstack-quant-cashflows --bin gen_cashflow_schemas -- --check",
  "cargo run -p finstack-quant-factor-model --bin gen_factor_model_schemas -- --check",
  "cargo run -p finstack-quant-margin --bin gen_margin_schema -- --check",
  "cargo run -p finstack-quant-scenarios --bin gen_scenario_schemas -- --check",
  "cargo run -p finstack-quant-statements --bin gen_statement_schemas -- --check",
  "cargo run -p finstack-quant-valuations --bin gen_schemas -- --check",
  "cargo run -p finstack-quant-portfolio --bin gen_materialization_schemas -- --check",
  "uv run --no-sync python scripts/check_schema_generation.py",
  "cargo test -p finstack-quant-cashflows --test cashflows schema_roundtrip:: --no-fail-fast",
  "cargo test -p finstack-quant-portfolio --test materialization_schema --no-fail-fast",
  "cargo test -p finstack-quant-margin --test schema_parity --no-fail-fast",
  "cargo test -p finstack-quant-attribution --test attribution attribution::schema_contract:: --no-fail-fast",
  "cargo test -p finstack-quant-statements --test schema_contract --no-fail-fast",
  "cargo test -p finstack-quant-scenarios --test schema_contract --no-fail-fast",
  "cargo test -p finstack-quant-factor-model --test schema_contract --no-fail-fast",
  "cargo test -p finstack-quant-valuations --test integration schema_parity --no-fail-fast",
  "cargo test -p finstack-quant-valuations --lib test_instrument_schema_union_parity --no-fail-fast",
  "cargo test -p finstack-quant-valuations --test schema_audit --no-fail-fast",
]

[tasks.rust-gen-schemas]
description = "Regenerate typed JSON schemas from Rust types"
run = [
  "cargo run -p finstack-quant-attribution --bin gen_attribution_schemas -- --write",
  "cargo run -p finstack-quant-cashflows --bin gen_cashflow_schemas -- --write",
  "cargo run -p finstack-quant-factor-model --bin gen_factor_model_schemas -- --write",
  "cargo run -p finstack-quant-margin --bin gen_margin_schema -- --write",
  "cargo run -p finstack-quant-scenarios --bin gen_scenario_schemas -- --write",
  "cargo run -p finstack-quant-statements --bin gen_statement_schemas -- --write",
  "cargo run -p finstack-quant-valuations --bin gen_schemas -- --write",
  "cargo run -p finstack-quant-portfolio --bin gen_materialization_schemas -- --write",
]

[tasks.gen-check]
description = "Regenerate schemas and bindings; fail on second-run drift"
run = """
set -eu
mise run rust-serde-audit
uv run --no-sync python scripts/generation_digest.py --check-manifest
before_digest=$(uv run --no-sync python scripts/generation_digest.py)
mise run rust-check-schemas
mise run wasm-check-bindings
uv run --no-sync python scripts/check_generated_instrument_fixtures.py \
  || (echo 'Generated instrument fixtures do not match the registry manifest'; exit 1)
uv run --no-sync python scripts/sync_generated_ts_index.py --check \
  || (echo 'Generated TypeScript index is out of date'; exit 1)
after_digest=$(uv run --no-sync python scripts/generation_digest.py)
test "$before_digest" = "$after_digest" \
  || (echo "Generated artifacts changed during the check: $before_digest -> $after_digest"; exit 1)
uv run --no-sync python scripts/generation_digest.py --check-manifest
echo "Generated artifacts are idempotent: sha256:$after_digest"
"""

# ─────────────────────────────────────────────────────────────────
# Pre-commit / CI supply-chain
# ─────────────────────────────────────────────────────────────────

[tasks.pre-commit-install]
description = "Install pre-commit hooks (commit + pre-push)"
run = [
  "uv run --no-sync pre-commit install",
  "uv run --no-sync pre-commit install --hook-type pre-push",
]

[tasks.pre-commit-run]
description = "Run all pre-commit hooks on the full tree (CI lint job)"
run = [
  "uv run --no-sync pre-commit run --all-files",
  "uv run --no-sync pre-commit run --all-files --hook-stage pre-push",
]

[tasks.pre-commit-update]
description = "Autoupdate pre-commit hook versions"
run = "uv run --no-sync pre-commit autoupdate"

[tasks.osv-scan]
description = "Full OSV lockfile scan (CI push-to-master job; PR CI is diff-only)"
run = """
osv-scanner \
  --lockfile=Cargo.lock \
  --lockfile=uv.lock \
  --lockfile=finstack-quant-wasm/package-lock.json
"""

# ─────────────────────────────────────────────────────────────────
# Benchmarks (Rust-only)
# ─────────────────────────────────────────────────────────────────

[tasks.check-loc]
description = "List source files exceeding the LOC limit (default 1000); -- --ci to exit 1 on violations"
run = "uv run python scripts/check_loc.py"

[tasks.rust-bench]
description = "Run Rust benchmarks with reduced Criterion timing (override: FQ_BENCH_SAMPLE_SIZE, FQ_BENCH_WARM_UP_TIME, FQ_BENCH_MEASUREMENT_TIME, FQ_BENCH_NRESAMPLES)"
run = "cargo bench --profile bench --bench '*' -- --sample-size ${FQ_BENCH_SAMPLE_SIZE:-10} --warm-up-time ${FQ_BENCH_WARM_UP_TIME:-1} --measurement-time ${FQ_BENCH_MEASUREMENT_TIME:-1} --nresamples ${FQ_BENCH_NRESAMPLES:-1000} --noplot"

[tasks.rust-bench-baseline]
description = "Save benchmark baseline as 'main'"
run = "cargo bench --bench '*' -- --save-baseline main --sample-size ${FQ_BENCH_SAMPLE_SIZE:-10} --warm-up-time ${FQ_BENCH_WARM_UP_TIME:-1} --measurement-time ${FQ_BENCH_MEASUREMENT_TIME:-1} --nresamples ${FQ_BENCH_NRESAMPLES:-1000} --noplot"

[tasks.rust-bench-compare]
description = "Compare current benchmarks against 'main' and fail above 10% median regression"
run = """
cargo bench --bench '*' -- --baseline main --sample-size ${FQ_BENCH_SAMPLE_SIZE:-10} --warm-up-time ${FQ_BENCH_WARM_UP_TIME:-1} --measurement-time ${FQ_BENCH_MEASUREMENT_TIME:-1} --nresamples ${FQ_BENCH_NRESAMPLES:-1000} --noplot
uv run python scripts/check_criterion_regressions.py --threshold 0.10
"""

[tasks.materialization-benchmark-doc-check]
description = "Verify tracked benchmark digests, baselines, and toolchains"
run = """
uv run python scripts/sync_materialization_benchmark_digest.py \
  --artifact docs/materialization-benchmark-results.json \
  --document docs/MATERIALIZATION_BENCHMARKS.md --check
uv run python scripts/check_materialization_benchmark_docs.py \
  --artifact docs/materialization-benchmark-results.json \
  --document docs/MATERIALIZATION_BENCHMARKS.md \
  --baseline-manifest docs/materialization-benchmark-baseline.json \
  --rust-baseline docs/benchmarks/materialization-rust-baseline.json \
  --python-baseline docs/benchmarks/materialization-python-baseline.json
"""

[tasks.materialization-rust-bench-baseline]
description = "Explicitly establish immutable Rust baseline; set FQ_REPLACE_MATERIALIZATION_BASELINE=1 to replace"
run = """
replace_flag=$(uv run python scripts/materialization_baseline_replace_flag.py)
uv run python scripts/manage_materialization_rust_baseline.py guard \
  --baseline docs/benchmarks/materialization-rust-baseline.json \
  $replace_flag
mise run materialization-benchmark-fixtures
uv run python scripts/check_python_materialization_regressions.py prepare \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --output target/materialization-criterion/baseline-run-metadata.json
CARGO_TARGET_DIR=target/materialization-criterion \
FQ_MATERIALIZATION_CRITERION_DIR="$PWD/target/materialization-criterion/criterion" \
FQ_MATERIALIZATION_P95_SAMPLES=${FQ_MATERIALIZATION_P95_SAMPLES:-100} \
cargo bench -p finstack-quant-portfolio --bench materialization -- \
  --sample-size ${FQ_MATERIALIZATION_P95_SAMPLES:-100} \
  --warm-up-time 1 --measurement-time 5 --nresamples 1000 --noplot
uv run python scripts/manage_materialization_rust_baseline.py establish \
  --criterion-dir target/materialization-criterion/criterion \
  --run-metadata target/materialization-criterion/baseline-run-metadata.json \
  --baseline-name materialization-v1 \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --output docs/benchmarks/materialization-rust-baseline.json \
  $replace_flag
uv run python scripts/manage_materialization_rust_baseline.py seal \
  --baseline docs/benchmarks/materialization-rust-baseline.json \
  --manifest docs/materialization-benchmark-baseline.json
"""

[tasks.materialization-rust-bench-compare]
description = "Compare exact fresh materialization outputs against the checked-in baseline"
run = """
mise run materialization-benchmark-fixtures
uv run python scripts/prepare_materialization_criterion_run.py \
  --baseline docs/benchmarks/materialization-rust-baseline.json \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --output target/materialization-criterion/run-metadata.json
CARGO_TARGET_DIR=target/materialization-criterion \
FQ_MATERIALIZATION_CRITERION_DIR="$PWD/target/materialization-criterion/criterion" \
FQ_MATERIALIZATION_P95_SAMPLES=${FQ_MATERIALIZATION_P95_SAMPLES:-100} \
cargo bench -p finstack-quant-portfolio --bench materialization -- \
  --sample-size ${FQ_MATERIALIZATION_P95_SAMPLES:-100} \
  --warm-up-time 1 --measurement-time 5 --nresamples 1000 --noplot
uv run python scripts/check_criterion_regressions.py \
  --criterion-dir target/materialization-criterion/criterion \
  --baseline docs/benchmarks/materialization-rust-baseline.json \
  --run-metadata target/materialization-criterion/run-metadata.json \
  --comparison-output target/materialization-criterion/comparison.json \
  --threshold 0.10
"""

[tasks.materialization-benchmark-record]
description = "Regenerate and verify the complete release materialization benchmark record"
run = """
mise run materialization-benchmark-fixtures
uv run python scripts/manage_materialization_rust_baseline.py verify \
  --baseline docs/benchmarks/materialization-rust-baseline.json \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --manifest docs/materialization-benchmark-baseline.json
uv run python scripts/check_python_materialization_regressions.py verify \
  --baseline docs/benchmarks/materialization-python-baseline.json \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --manifest docs/materialization-benchmark-baseline.json
FQ_MATERIALIZATION_P95_SAMPLES=${FQ_MATERIALIZATION_P95_SAMPLES:-100} \
FQ_MATERIALIZATION_RAW_OUTPUT="$PWD/target/materialization-results/rust.json" \
mise run materialization-rust-bench-compare
FQ_MATERIALIZATION_P95_SAMPLES=${FQ_MATERIALIZATION_P95_SAMPLES:-100} \
FQ_MATERIALIZATION_PYTHON_CURRENT_OUTPUT=target/materialization-python/current-record.json \
FQ_MATERIALIZATION_PYTHON_COMPARISON_OUTPUT=target/materialization-python/comparison-record.json \
mise run python-bench-portfolio-compare
npm --prefix finstack-quant-wasm run build:node
FQ_MATERIALIZATION_P95_SAMPLES=${FQ_MATERIALIZATION_P95_SAMPLES:-100} \
FQ_MATERIALIZATION_RAW_OUTPUT=target/materialization-results/wasm.json \
npm --prefix finstack-quant-wasm run bench -- --materialization-only
uv run python scripts/manage_materialization_rust_baseline.py verify \
  --baseline docs/benchmarks/materialization-rust-baseline.json \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --manifest docs/materialization-benchmark-baseline.json
uv run python scripts/collect_materialization_results.py \
  --rust target/materialization-results/rust.json \
  --python target/materialization-python/current-record.json \
  --wasm target/materialization-results/wasm.json \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --baseline docs/materialization-benchmark-baseline.json \
  --rust-baseline docs/benchmarks/materialization-rust-baseline.json \
  --rust-comparison target/materialization-criterion/comparison.json \
  --python-baseline docs/benchmarks/materialization-python-baseline.json \
  --python-comparison target/materialization-python/comparison-record.json \
  --output docs/materialization-benchmark-results.json \
  --command 'mise run materialization-benchmark-record' \
  --command 'FQ_MATERIALIZATION_P95_SAMPLES=100 FQ_MATERIALIZATION_RAW_OUTPUT=$PWD/target/materialization-results/rust.json mise run materialization-rust-bench-compare' \
  --command 'FQ_MATERIALIZATION_P95_SAMPLES=100 FQ_MATERIALIZATION_PYTHON_CURRENT_OUTPUT=target/materialization-python/current-record.json FQ_MATERIALIZATION_PYTHON_COMPARISON_OUTPUT=target/materialization-python/comparison-record.json mise run python-bench-portfolio-compare' \
  --command 'FQ_MATERIALIZATION_P95_SAMPLES=100 FQ_MATERIALIZATION_RAW_OUTPUT=target/materialization-results/wasm.json npm --prefix finstack-quant-wasm run bench -- --materialization-only' \
  --command 'uv run python scripts/collect_materialization_results.py --rust target/materialization-results/rust.json --python target/materialization-python/current-record.json --wasm target/materialization-results/wasm.json --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json --baseline docs/materialization-benchmark-baseline.json --rust-baseline docs/benchmarks/materialization-rust-baseline.json --rust-comparison target/materialization-criterion/comparison.json --python-baseline docs/benchmarks/materialization-python-baseline.json --python-comparison target/materialization-python/comparison-record.json --output docs/materialization-benchmark-results.json'
uv run python scripts/sync_materialization_benchmark_digest.py \
  --artifact docs/materialization-benchmark-results.json \
  --document docs/MATERIALIZATION_BENCHMARKS.md --write
mise run materialization-benchmark-doc-check
"""
